<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultation - Elegant Interior Designs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="py-5">
  <div class="container">
    <h2 class="text-center mb-4">Consultation</h2>
    <p class="text-center">Book a consultation to discuss your interior design needs with our experts.</p>
    <!-- Consultation form placeholder -->
    <form class="mx-auto" style="max-width:500px;">
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email">
      </div>
      <div class="mb-3">
        <label for="details" class="form-label">Project Details</label>
        <textarea class="form-control" id="details" rows="4"></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>

    <div class="text-center mt-4">
      <a href="index.html#home" class="btn btn-warning">Back to Home</a>
    </div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
