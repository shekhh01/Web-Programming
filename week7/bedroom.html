<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedroom - Elegant Interior Designs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    
    .bedroom-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .bedroom-grid img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .bedroom-grid img:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg,#163029,#1F3D36);">
  <div class="container">
    <a class="navbar-brand" href="index.html">Elegant Interior Designs</a>
  </div>
</nav>

<!-- Bedroom Section -->
<section class="gallery-page py-5">
  <div class="container">
    <h1 class="mb-3">Bedroom Designs</h1>
    <p>Our bedroom designs focus on comfort and elegance, combining modern furniture, soft lighting, and harmonious colors to create a relaxing atmosphere.</p>
    

    <div class="bedroom-grid">
      <img src="https://i.pinimg.com/736x/88/5d/5d/885d5dc1817d96738d860b9b6849d8cf.jpg" alt="Bedroom Image 1">
      <img src="https://i.pinimg.com/1200x/5f/62/0a/5f620abe78ecf9b09b223d0150a47a13.jpg" alt="Bedroom Image 2">
      <img src="https://i.pinimg.com/736x/1d/a1/c2/1da1c202651d7e35a2b45754a22d2822.jpg" alt="Bedroom Image 3">
      <img src="https://i.pinimg.com/736x/0e/ea/0c/0eea0cb05994e078b9783b79e9e0f879.jpg" alt="Bedroom Image 4">
    </div>

    <div class="text-center mt-4">
      <a href="index.html#gallery" class="btn btn-secondary">Back to Gallery</a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
