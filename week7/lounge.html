<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lounge - Elegant Interior Designs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    
    .lounge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .lounge-grid img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .lounge-grid img:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }

    @media(max-width:768px){
      .lounge-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg,#163029,#1F3D36);">
  <div class="container">
    <a class="navbar-brand" href="index.html">Elegant Interior Designs</a>
  </div>
</nav>

<section class="gallery-page py-5" style="background: linear-gradient(90deg,#F5F2EC,#E8E1D8);">
  <div class="container">
    <h1 class="mb-3" style="color:#163029;">Lounge Designs</h1>
    <p style="color:#2E2E2E; font-size:1.1rem;">
      Our lounge areas are designed for relaxation and socializing. Comfortable seating, warm lighting, and sophisticated decor make every lounge both inviting and elegant.
    </p>
    
    
    <div class="lounge-grid">
      <img src="https://i.pinimg.com/1200x/1a/9c/a6/1a9ca60eaf1541afa8d0ecbf45fe0850.jpg" alt="Lounge Image 1">
      <img src="https://i.pinimg.com/1200x/92/17/fc/9217fc79030f4979329017c697b90183.jpg" alt="Lounge Image 2">
      <img src="https://i.pinimg.com/736x/45/4b/65/454b658dd5c608327f83688eb090f2ac.jpg" alt="Lounge Image 3">
      <img src="https://i.pinimg.com/1200x/4a/0e/33/4a0e333078f6a8a0e01b355128845db4.jpg" alt="Lounge Image 4">
    </div>

    <div class="text-center mt-5">
      <a href="index.html#gallery" class="btn btn-secondary">Back to Gallery</a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
