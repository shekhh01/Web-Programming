<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultation - Elegant Interior Designs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="py-5">
  <div class="container">
    <h2 class="text-center mb-4">Consultation Request</h2>
    <p class="text-center">Schedule your interior design consultation here.</p>

    <!-- Consultation Form -->
    <form class="mx-auto needs-validation" style="max-width:500px;" novalidate>

      <!-- Full Name -->
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" required>
        <div class="invalid-feedback">
          Please enter your full name.
        </div>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" required>
        <div class="invalid-feedback">
          Please enter a valid email address.
        </div>
      </div>

      <!-- Contact Number -->
      <div class="mb-3">
        <label for="contact" class="form-label">Contact Number</label>
        <input type="tel" class="form-control" id="contact" placeholder="+977 980xxxxxxx" required>
        <div class="invalid-feedback">
          Please enter your contact number.
        </div>
      </div>

      <!-- Preferred Date -->
      <div class="mb-3">
        <label for="date" class="form-label">Preferred Date</label>
        <input type="date" class="form-control" id="date" required>
        <div class="invalid-feedback">
          Please select a preferred date.
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary w-100">Submit Request</button>
    </form>

    <!-- Back Button -->
    <div class="text-center mt-4">
      <a href="index.html#home" class="btn btn-secondary">Back to Home</a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
