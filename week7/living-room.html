<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Room - Elegant Interior Designs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    
    .living-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .living-grid img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .living-grid img:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }

    @media(max-width:768px){
      .living-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg,#163029,#1F3D36);">
  <div class="container">
    <a class="navbar-brand" href="index.html">Elegant Interior Designs</a>
  </div>
</nav>


<section class="gallery-page py-5" style="background: linear-gradient(90deg,#F5F2EC,#E8E1D8);">
  <div class="container">
    <h1 class="mb-3" style="color:#163029;">Living Room Designs</h1>
    <p style="color:#2E2E2E; font-size:1.1rem;">
      Our living room designs emphasize comfort and style, incorporating functional furniture, cozy lighting, and elegant decor to create a welcoming atmosphere for family and guests.
    </p>
    
 
    <div class="living-grid">
      <img src="https://i.pinimg.com/1200x/5d/9b/23/5d9b23ee3767bd45ee49c1e1ba13e2cb.jpg" alt="Living Room Image 1">
      <img src="https://i.pinimg.com/1200x/a4/42/bc/a442bce057ede88dce2a3a581f352194.jpg" alt="Living Room Image 2">
      <img src="https://i.pinimg.com/736x/26/46/d0/2646d0c322b3dfd640bcdbee171ddfce.jpg" alt="Living Room Image 3">
      <img src="https://i.pinimg.com/1200x/a0/02/b9/a002b9349faec6d10e48e708e095d723.jpg" alt="Living Room Image 4">
    </div>

    <div class="text-center mt-5">
      <a href="index.html#gallery" class="btn btn-secondary">Back to Gallery</a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
