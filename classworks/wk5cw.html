<!DOCTYPE html>
<html>
<head>
<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
}


header {
  background-color: teal;
  color: white;
  padding: 20px;
  text-align: center;
}


.container {
  display: flex;
  flex-flow: row wrap;  
  background-color:aquamarine;
  padding: 10px;
}


.container div {
  background-color:beige;
  flex:150px;       
  margin: 10px;
  padding: 30px 0;
  text-align: center;
  font-size: 20px;
}


footer {
  background-color:azure;
  color: white;
  padding: 20px;
  text-align: center;
}


@media (max-width: 700px) {
  .container {
    flex-direction: column;
  }
}


@media (max-width: 400px) {
  .container {
    flex-direction: row;
    flex-wrap: wrap;
  }

  .container div {
    flex: 45%;
    font-size: 16px;
    padding: 20px 0;
  }
}
</style>
</head>

<body>

<header>
  HEADER 
</header>

<div class="container">
  <div>Item 1</div>
  <div>Item 2</div>
  <div>Item 3</div>
  <div>Item 4</div>
</div>

<footer>
  FOOTER 
</footer>

</body>
</html>
